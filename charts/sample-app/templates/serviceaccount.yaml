{{- if and .Values.serviceAccount.create .Values.serviceAccount.name }}
# Bound to an IAM role by an EKS Pod Identity association (workloads-eks), not by annotation.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  labels:
    {{- include "sample-app.labels" . | nindent 4 }}
{{- end }}
